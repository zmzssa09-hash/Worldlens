# 뉴스 갱신 → 사이트 만들기 → Vercel에 올리기 (서버 없이 자동으로)
#
# 필요한 설정 (GitHub 저장소 → Settings → Secrets and variables → Actions)
#   Secrets:  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (필수)
#             ANTHROPIC_API_KEY                                 (선택: 넣으면 AI 분석·번역)
#   Variables: WORLDLENS_CONTACT_EMAIL 등                        (선택: 사이트 아래쪽 문의 메일)
#
# 20분 간격 '사슬': GitHub의 예약 실행은 몇십 분~1시간씩 밀려서, 갱신이 끝나면 시작 20분 뒤에
# 다음 갱신을 스스로 부름(workflow_dispatch). 사슬이 끊기면 3시간마다 도는 예비 예약이 다시 이어 붙임.
# Vercel 무료 플랜은 하루 배포 횟수에 제한(약 100번)이 있음 → 20분 간격 = 하루 72번
name: 뉴스 갱신 및 배포

on:
  schedule:
    - cron: '0 */3 * * *'    # 예비: 사슬이 끊겼을 때 다시 시작 (사슬이 살아 있으면 건너뜀)
    # 아침 7시 브리핑은 따로 예약하지 않음: 7시가 지난 첫 갱신이 새로 만듦 (refresh-cli.js)
  workflow_dispatch:         # Actions 화면의 'Run workflow' 또는 사슬이 부름
  push:                      # 코드를 고쳐 올리면 바로 갱신 (끊긴 사슬도 이걸로 다시 시작됨)
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/update.yml']

permissions:
  contents: read
  actions: write # 다음 갱신을 부르고, 최근 실행을 확인하는 데 필요

env:
  CHAIN_SECONDS: 1200 # 갱신 간격 (20분)

jobs:
  # 예비 예약일 때: 최근 40분 안에 다른 갱신이 있었으면(사슬이 살아 있으면) 건너뜀
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          recent=$(gh run list -R "$GITHUB_REPOSITORY" -w update.yml -L 20 --json databaseId,createdAt \
            | jq --argjson me "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $me) | select((now - (.createdAt | fromdateiso8601)) < 2400)] | length')
          echo "최근 40분 안의 다른 갱신: $recent"
          if [ "$recent" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  # 줄 세우기(concurrency)는 실제 갱신 작업에만: 예전엔 실행 전체에 걸려 있어서,
  # 사슬이 살아 있을 때 예비 예약이 대기열에서 밀려 취소됨으로 끝나고 그때마다 GitHub가 메일을 보냈음
  # → 이제 예비 예약은 gate에서 건너뜀으로 조용히 끝남
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    concurrency:
      group: worldlens-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - name: 시작 시각 기록 (다음 갱신 간격 계산용)
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 지난번 실행에서 저장한 데이터베이스(모은 기사·번역·분석)와 과거 뉴스 보관본을 이어서 씀
      - name: 지난 데이터 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data
          key: worldlens-db-${{ github.run_id }}
          restore-keys: worldlens-db-

      # 캐시가 지워졌거나 비어 있으면 하루 한 번 떠 둔 백업(아티팩트)에서 되살림
      - name: 캐시가 없으면 백업에서 되살리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/worldlens.db ]; then echo "캐시에서 데이터를 불러왔어요"; exit 0; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -r '[.artifacts[] | select(.expired | not) | select(.name | startswith("worldlens-backup-"))] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then echo "::warning::캐시도 백업도 없어 처음부터 모아요"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/backup.zip
          mkdir -p data && unzip -o -q /tmp/backup.zip -d /tmp/backup && tar -xzf /tmp/backup/data.tgz
          echo "::warning::캐시가 없어서 백업(아티팩트 $id)에서 데이터를 되살렸어요"

      - name: 뉴스 갱신 + 사이트 만들기
        run: node --disable-warning=ExperimentalWarning src/refresh-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLDLENS_CONTACT_EMAIL: ${{ vars.WORLDLENS_CONTACT_EMAIL }}
          WORLDLENS_BUSINESS_NAME: ${{ vars.WORLDLENS_BUSINESS_NAME }}
          WORLDLENS_BUSINESS_OWNER: ${{ vars.WORLDLENS_BUSINESS_OWNER }}
          WORLDLENS_BUSINESS_REG_NO: ${{ vars.WORLDLENS_BUSINESS_REG_NO }}
          WORLDLENS_MAIL_ORDER_NO: ${{ vars.WORLDLENS_MAIL_ORDER_NO }}
          WORLDLENS_BUSINESS_ADDRESS: ${{ vars.WORLDLENS_BUSINESS_ADDRESS }}

      - name: 데이터 저장 (다음 실행에서 이어 씀)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: worldlens-db-${{ github.run_id }}

      # 캐시는 실행마다 새로 쌓임(하루 약 72개) → 최근 5개만 남기고 지움
      - name: 오래된 캐시 정리
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key worldlens-db- --sort created_at --order desc --limit 100 --json id \
            | jq -r '.[5:][].id' | while read -r id; do gh cache delete "$id" -R "$GITHUB_REPOSITORY" >/dev/null && echo "지움: $id"; done

      # 백업: 캐시 하나에만 데이터가 있으면 날아갈 때 전부 잃음 → 한국 날짜 기준 하루 한 번 아티팩트로 떠 둠 (30일 보관)
      - name: 오늘 백업이 있는지 확인
        id: backup
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date +%Y%m%d)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=worldlens-backup-$day" --jq '.total_count')
          echo "day=$day" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "need=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 저장소가 공개라 아티팩트는 누구나 받을 수 있음 → 회원·결제 정보를 뺀 사본으로 백업
          rm -rf /tmp/bk && mkdir -p /tmp/bk/data
          node --disable-warning=ExperimentalWarning src/backup-cli.js /tmp/bk/data/worldlens.db
          if [ -d data/archive ]; then cp -r data/archive /tmp/bk/data/; fi
          tar -czf data.tgz -C /tmp/bk data
          echo "need=true" >> "$GITHUB_OUTPUT"

      - name: 하루 한 번 데이터 백업
        if: success() && steps.backup.outputs.need == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worldlens-backup-${{ steps.backup.outputs.day }}
          path: data.tgz
          retention-days: 30
          compression-level: 0

      - name: Vercel에 올리기
        working-directory: dist
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID 중 비어 있는 게 있어요. 저장소 Settings → Secrets and variables → Actions 에서 이름을 확인하세요."
            exit 1
          fi
          # 파일 수천 개를 따로 올리면 무료 플랜의 '하루 업로드 5,000개' 제한에 걸림 (2026-11-11 갱신이 멈춘 원인)
          # → 하나로 묶어(tgz) 올림: 한 번 배포 = 업로드 1개
          # 버전 고정: @latest면 Vercel이 동작을 바꿀 때 어느 날 갑자기 배포가 깨질 수 있음
          npx --yes vercel@65.12.1 deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 올리기 명령이 성공해도 실제 사이트가 새 데이터를 보여 주는지는 따로 확인
      # 맞지 않으면 경고만 남김 (실패로 끝내면 GitHub가 메일을 보냄)
      - name: 실제 사이트에 새 데이터가 올라갔는지 확인
        continue-on-error: true
        env:
          SITE: ${{ vars.WORLDLENS_SITE_URL || 'https://worldlens-three.vercel.app' }}
        run: |
          want=$(jq -r '.last_refresh' dist/data/status.json)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "${SITE%/}/data/status.json?t=$(date +%s)" | jq -r '.last_refresh' || true)
            if [ "$got" = "$want" ]; then echo "사이트에 새 데이터가 보여요 ($got)"; exit 0; fi
            sleep 10
          done
          echo "::warning::사이트 데이터가 아직 예전 것이에요 (사이트: $got / 방금 만든 것: $want)"

      # 사슬: 시작 20분 뒤에 다음 갱신을 부름. 이번 갱신이 실패해도 사슬은 이어감.
      # 이미 기다리는 갱신이 있으면(직접 누른 실행·코드 올림) 부르지 않음 → 사슬이 둘로 갈라지지 않게
      # 예비 예약(schedule)은 세지 않음: 사슬이 살아 있으면 예비 예약은 아무것도 안 하고 끝나므로,
      # 그걸 '다음 갱신'으로 믿고 안 부르면 사슬이 끊김 (2026-11-11 15:55에 실제로 끊겼던 원인)
      - name: 다음 갱신 부르기 (20분 간격)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( CHAIN_SECONDS - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then echo "다음 갱신까지 ${wait}초 기다려요"; sleep "$wait"; fi
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w update.yml -L 20 --json databaseId,status,event \
            | jq --argjson me "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $me) | select(.event != "schedule") | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')
          if [ "$pending" -gt 0 ]; then echo "이미 기다리는 갱신이 있어 부르지 않아요 ($pending)"; exit 0; fi
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          echo "다음 갱신을 불렀어요"
